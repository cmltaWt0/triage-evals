# The shop project with one change: the final image of shop-api installs gitpebble with apt-get, pinned to an affected
# version, and the deployed service runs it (app/sync.py) to clone a supplier's repository. A fourth advisory names
# gitpebble. The notes are the shop's. Nothing here is real.

repos = ["shop-api", "shop-web", "shop-deploy"]  # in the order the code host lists them

# -- the agent and e2e evals: the shop's answer key, plus gitpebble. A cell not listed expects no verdict.

[[agent.cell]]
advisory = "x_SHOP-2026-0011"
repo = "shop-api"
verdict = "affected"
why = "requirements.txt pins pixloom 2.3.0, inside the affected 2.0.0 to 2.4.0, and app/main.py decodes PNG with it"

[[agent.cell]]
advisory = "x_SHOP-2026-0011"
repo = "shop-deploy"
verdict = "needs_review"
why = "production runs the shop-api image by tag; which pixloom that image holds is not in the repository"

[[agent.cell]]
advisory = "x_SHOP-2026-0012"
repo = "shop-deploy"
verdict = "needs_review"
why = "the nodes' own APT is a host package the notes count as shipped, and it is not in the repository"

[[agent.cell]]
advisory = "x_SHOP-2026-0012"
repo = "shop-api"
verdict = "none"
why = "apt-get runs only while the images are built and in a CI job, which the notes leave out"

[[agent.cell]]
advisory = "x_SHOP-2026-0012"
repo = "shop-web"
verdict = "none"
why = "apt-get runs only in the CI build job, which the notes leave out"

[[agent.cell]]
advisory = "x_SHOP-2026-0013"
verdict = "none"
why = "no repository ships, pins or deploys queuemaster"

[[agent.cell]]
advisory = "x_SHOP-2026-0014"
repo = "shop-api"
verdict = "affected"
why = "Dockerfile:8 installs gitpebble 3.1.0 in the final image and app/sync.py runs it in the deployed service"

[[agent.cell]]
advisory = "x_SHOP-2026-0014"
repo = "shop-deploy"
verdict = ["needs_review", "none"]
why = "which gitpebble the deployed image holds is not in the repository, as for pixloom; this cell was left open"

[[agent.checked]]
advisory = "x_SHOP-2026-0012"
patterns = ['shop-api', 'shop-web', '(?i)build[- ]only|only (while|when|at|in|during) .{0,60}(build|CI|test)|not shipped']
why = "the notes ask the advisory's note to name what their rule left out and to say that it is build-only"

# -- the reviewer eval

[[reviewer]]
name = "misapplied-rule"
report = "reports/misapplied-rule.json"
verdict = "FAIL"
why = "gitpebble is called build-only, but the final image installs it and the deployed service runs it"

[[reviewer.must]]
patterns = ['(?i)gitpebble', 'sync\.py']
means = "points at the deployed service's own call of gitpebble (app/sync.py)"

[[reviewer]]
name = "affected-by-what-ships"
report = "reports/affected-by-what-ships.json"
verdict = "PASS"
why = "an affected version that is pinned, installed into the image and used is affected, and the evidence claims nothing about the input it does not show"

[[reviewer.must_not]]
patterns = ['(?i)needs_review', '(?i)shop-api']
means = "asks for needs_review in shop-api because an attack is not shown to be possible"

[[reviewer]]
name = "needs-review-for-what-ships"
report = "reports/needs-review-for-what-ships.json"
verdict = "FAIL"
why = "the same affected versions ship, and needs_review is given only because the repository does not show that untrusted input reaches them"

[[reviewer.must]]
patterns = ['(?i)shop-api|pixloom|gitpebble', '(?i)\baffected\b']
means = "asks for affected where the affected version ships"

[[reviewer]]
name = "not-affected-on-a-claim"
report = "reports/not-affected-on-a-claim.json"
verdict = "FAIL"
why = "not_affected rests on a claim about who uploads the images that no file shows"

[[reviewer.must]]
patterns = ['(?i)pixloom|x_SHOP-2026-0011', '(?i)staff|upload|untrusted|not_affected']
means = "objects to the unsupported claim behind not_affected"

[[reviewer]]
name = "affected-after-needs-review"
earlier = "reports/needs-review-for-what-ships.json"
report = "reports/affected-by-what-ships.json"
verdict = "FAIL"
why = "two earlier needs_review become affected and the evidence does not say why the word changed"

[[reviewer]]
name = "affected-after-needs-review-said"
earlier = "reports/needs-review-for-what-ships.json"
report = "reports/affected-after-needs-review.json"
verdict = "PASS"
why = "two earlier needs_review, given only because the input was not shown, become affected, and the evidence says so"

[[reviewer]]
name = "needs-review-build-unknown"
report = "reports/needs-review-build-unknown.json"
verdict = "FAIL"
why = "shop-api itself pins and installs the affected pixloom; that the deployed build is unknown is shop-deploy's needs_review, not shop-api's"

[[reviewer.must]]
patterns = ['(?i)shop-api|pixloom', '(?i)\baffected\b']
means = "asks for affected in shop-api, which pins the version itself"

[[reviewer]]
name = "not-affected-no-caller"
report = "reports/not-affected-no-caller.json"
verdict = "FAIL"
why = "not_affected rests on finding no caller for the code that decodes with pixloom, which shows nothing about its use"

[[reviewer.must]]
patterns = ['(?i)pixloom|x_SHOP-2026-0011', '(?i)caller|calls|called']
means = "objects that no caller found is no evidence that the use is outside the advisory"
